<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelime Ezberleme - CBJ Quiz App</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="pics/logo.png" type="image/png">
</head>

<body>
  <div class="container" style="text-align: center;">
    <button id="closeButton" class="close-button" title="Geri Dön">×</button>
    <h2 style="margin-top: 10px; margin-bottom: 5px;">Word Memorization</h2>
    <p style="color: var(--text-muted); font-size: 0.88em; margin-bottom: 20px;">
      Veritabanından güncel kelime listelerini yükleyin ve pratik yapın.
    </p>

    <!-- Loading Indicator -->
    <div id="loading-indicator" style="margin: 30px 0; font-size: 1.1em; color: var(--primary);">
      <span style="display: inline-block; animation: spin 1s linear infinite; margin-right: 8px;">⏳</span>
      Kelimeler yükleniyor...
    </div>

    <!-- Dynamic Categories Container -->
    <div class="scroll-menu" id="categories-container" style="display: none;">
      <!-- JavaScript will populate categories and lists here -->
    </div>
  </div>

  <script src="sheetToJson.js"></script>
</body>

</html>
